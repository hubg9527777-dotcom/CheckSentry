  setStatus('正在读取本机软件和浏览器扩展…', 'busy');
  try {
    const data = await loadSpecialInventory(search), items = data.items || [];
    const prepared = items.map(item => ({item, forms:prepareSpecialItem(item)})), groups = [];
    for (let index = 0; index < queries.length; index++) {
      const query = queries[index], matches = [];
      for (let i = 0; i < prepared.length; i++) {
        const match = specialMatch(query.forms, prepared[i].item, prepared[i].forms);
        if (match) matches.push({...match, item:prepared[i].item});
        if (i % 80 === 79) await pause(search);
      }
      const selection = selectSpecialMatches(matches);
      selection.matches.sort((a,b) => b.score - a.score || a.item.name.localeCompare(b.item.name, 'zh-CN'));
      groups.push({text:query.text, keywords:query.forms.keywords, ...selection});
      el('progress').value = Math.round((index + 1) / queries.length * 90);
      setStatus('正在排查 ' + (index + 1) + ' / ' + queries.length + '：' + query.text, 'busy');
      await pause(search);
    }
    groups.sort((a,b) => Number(Boolean(b.matches.length)) - Number(Boolean(a.matches.length)));
    const found = groups.filter(group => group.matches.length).length;
    const candidates = new Set(groups.flatMap(group => group.matches.map(match => match.item))).size;
    el('totals').replaceChildren();
    addStat('排查名称', groups.length); addStat('找到候选的名称', found, true); addStat('候选项目（去重）', candidates, true); addStat('未找到候选的名称', groups.length - found);
    el('scanInfo').textContent = '检索范围：软件 ' + items.filter(item => item.type === '软件').length + ' 项，浏览器扩展 ' + items.filter(item => item.type !== '软件').length + ' 项。新安装或卸载后，请先返回首页重新扫描。';
    // Render while hidden so interrupted or failed runs never look like complete results.
    setStatus('匹配完成，正在整理全部候选…', 'busy');
    for (let index = 0; index < groups.length; index++) {
      const group = groups[index], link = node('a', group.text + ' · ' + group.matches.length, group.matches.length ? '' : 'no-match'); link.href = '#query-result-' + index;
      el('queryIndex').append(link);
      setStatus('正在整理结果 ' + (index + 1) + ' / ' + groups.length + '：' + group.text, 'busy');
      await renderGroup(group, index, search); el('progress').value = 90 + Math.round((index + 1) / groups.length * 10); await pause(search);
    }
    lastResults = groups; el('progress').value = 100; el('results').hidden = false;
    setStatus('排查完成：' + found + ' 个名称找到候选，共 ' + candidates + ' 个候选项目。请查看下方结果。');
    el('resultTitle').focus();
    el('results').scrollIntoView({behavior:'smooth', block:'start'});
  } catch (error) { invalidateResults(); setStatus(error.message, search.cancelled ? '' : 'error'); }
  finally {
    activeSearch = null; el('run').disabled = false; el('run').textContent = '执行排查'; el('queries').disabled = false;
    el('cancel').hidden = true; el('progressArea').hidden = true; el('results').setAttribute('aria-busy', 'false'); updateInputInfo();
  }
}
el('run').addEventListener('click', runSpecialSearch);
el('queries').addEventListener('input', onInputChange);
el('queries').addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); runSpecialSearch(); } });
el('clear').addEventListener('click', () => { el('queries').value = ''; onInputChange(); setStatus('输入已清空，可粘贴新的排查清单。'); el('queries').focus(); });
el('cancel').addEventListener('click', () => { if (activeSearch) { activeSearch.cancelled = true; if (activeSearch.controller) activeSearch.controller.abort(); setStatus('正在停止排查，输入将保留…'); } });
el('copy').addEventListener('click', () => {
  const text = 'CheckSentry 专项排查 · 候选仅供人工核对\n\n' + lastResults.map(group => '排查名称：' + group.text + '（' + group.matches.length + ' 个候选）\n' + (group.matches.map(match => itemText(match.item) + '\n匹配依据：' + match.reason).join('\n\n') || '当前扫描清单中未找到相关候选，不代表设备一定没有该项目。')).join('\n\n');
  return copyText(text, el('copy'));
});
try { const draft = sessionStorage.getItem(draftKey); if (draft) { el('queries').value = draft; setStatus('已恢复本标签页的排查清单，点击「执行排查」即可。'); } } catch (_) { el('draftHint').textContent = '浏览器禁止暂存，离开前请自行保留输入'; }
updateInputInfo();
</script>
