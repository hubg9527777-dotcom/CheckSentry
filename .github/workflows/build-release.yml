name: Build, test and release CheckSentry

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL security scan
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build launcher for CodeQL
        shell: pwsh
        run: dotnet build .\launcher\CheckSentry.Launcher.csproj --configuration Release
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:csharp'

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Run PowerShell tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Run Windows PowerShell compatibility tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Verify automatic browser session
        shell: pwsh
        run: node .\tests\check-session.js pwsh
      - name: Build and sign
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { $version = '0.0.0-test' }
          $certificatePath = ''
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'checksentry-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          }
          try {
            .\Build-Release.ps1 -Version $version -Runtime '${{ matrix.runtime }}' -CertificatePath $certificatePath -CertificatePassword $env:SIGNING_CERT_PASSWORD -OutputDirectory (Join-Path $PWD ('dist-${{ matrix.runtime }}'))
          } finally {
            if ($certificatePath -and (Test-Path $certificatePath)) { Remove-Item -LiteralPath $certificatePath -Force }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: CheckSentry-${{ matrix.runtime }}
          path: dist-${{ matrix.runtime }}/*.zip*

  release:
    if: github.ref_type == 'tag'
    needs: [build, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*.zip'
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
