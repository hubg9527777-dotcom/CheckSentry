name: Build, test and release CheckSentry

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL security scan
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build launcher for CodeQL
        shell: pwsh
        run: dotnet build .\launcher\CheckSentry.Launcher.csproj --configuration Release
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:csharp'

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Run PowerShell tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Build and sign
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { $version = '0.0.0-test' }
          $certificatePath = ''
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'checksentry-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          }
          .\Build-Release.ps1 -Version $version -Runtime '${{ matrix.runtime }}' -CertificatePath $certificatePath -CertificatePassword $env:SIGNING_CERT_PASSWORD -OutputDirectory (Join-Path $PWD ('dist-${{ matrix.runtime }}'))
          if ($certificatePath -and (Test-Path $certificatePath)) { Remove-Item $certificatePath -Force }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CheckSentry-${{ matrix.runtime }}
          path: dist-${{ matrix.runtime }}/*.zip*

  release:
    if: github.ref_type == 'tag'
    needs: [build, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'release/*.zip'
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
