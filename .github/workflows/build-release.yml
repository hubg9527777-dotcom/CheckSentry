name: Build, test and release CheckSentry

on:
  workflow_dispatch:
  push:
    tags: ['v1.2.0']

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL security scan
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build launcher for CodeQL
        shell: pwsh
        run: dotnet build .\launcher\CheckSentry.Launcher.csproj --configuration Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:csharp'

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run PowerShell tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Run Windows PowerShell compatibility tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Validate Prefetch parser (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Execution-Tests.ps1
      - name: Validate report JavaScript
        shell: pwsh
        run: |
          node .\tests\check-html.js
          node .\tests\check-special.js
          node .\tests\check-history.js
          node .\tests\check-security-baseline.js
          node .\tests\check-extension-icon-safety.js
          node .\tests\check-dedup.js
          node .\tests\check-history-usability.js
          node .\tests\check-unified-rules.js
          node .\tests\check-xlsx-path-safety.js
      - name: Verify automatic browser session
        shell: pwsh
        run: node .\tests\check-session.js pwsh
      - name: Build and sign
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          # Do not allow a workflow dispatch or release tag to change the locked app version.
          $version = '1.2.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:RELEASE_TAG -cne 'v1.2.0') { throw 'Only v1.2.0 can be published.' }
          $certificatePath = ''
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'checksentry-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          }
          try {
            .\Build-Release.ps1 -Version $version -Runtime '${{ matrix.runtime }}' -CertificatePath $certificatePath -CertificatePassword $env:SIGNING_CERT_PASSWORD -OutputDirectory (Join-Path $PWD ('dist-${{ matrix.runtime }}'))
          } finally {
            if ($certificatePath -and (Test-Path $certificatePath)) { Remove-Item -LiteralPath $certificatePath -Force }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: CheckSentry-${{ matrix.runtime }}
          path: dist-${{ matrix.runtime }}/*.zip*

  release:
    if: github.ref_type == 'tag'
    needs: [build, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*.zip'
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
